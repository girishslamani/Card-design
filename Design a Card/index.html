<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designing a Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Write html and css code to design a card. -->
    <div class="main">
        <div>
            <img src="https://img.magnific.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        </div>

        <div class="capsule">
            <span>Beautiful</span>
            <span>Flower</span>
        </div>

        <div class="content">
            <h2>Beautiful Image</h2>
            <p>
                Closeup shot of a beautiful butterfly with interesting textures on an orange-petaled flower
            </p>
        </div>

        <div class="button">
            <button>Read More</button>
        </div>
    </div>
</body>
</html>
